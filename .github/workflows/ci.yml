name: Flutter validation

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      # No production keystore is available to pull requests.
      - run: flutter build appbundle --release
      - name: Check native library 16-KiB alignment
        run: python3 .github/scripts/check_native_alignment.py build/app/outputs/bundle/release/app-release.aab
      - name: Check packaged APK 16-KiB alignment
        run: |
          flutter build apk --release
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-validation-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check required Apple SDK
        run: |
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" -ge 26
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-pod-lock
          path: ios/Podfile.lock
          if-no-files-found: error
