name: Build and Deploy to Stores

on:
  pull_request:
    branches: [ master, main ]
    types: [ closed ]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml

  # Build Android APK/AAB
  build-android:
    if: github.event.pull_request.merged == true
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      
      - name: Run tests
        run: flutter test
      
      # Decode keystore from base64 secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
      
      # Create key.properties
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
      
      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      # Build APK for testing
      - name: Build APK
        run: flutter build apk --release
      
      # Build AAB for Play Store
      - name: Build AAB
        run: flutter build appbundle --release
      
      - name: Check final Android artifacts
        run: |
          python3 .github/scripts/check_native_alignment.py build/app/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
      
      # Deploy to Google Play Console (internal track)
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mobile.apps.wouri
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal  # ou 'alpha', 'beta', 'production'
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew
          mappingFile: build/app/outputs/mapping/release/mapping.txt
  
  # Build iOS IPA
  build-ios:
    if: github.event.pull_request.merged == true
    needs: validate
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: Check required Apple SDK
        run: |
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" -ge 26
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26

      # Install CocoaPods dependencies
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      
      # Import certificates and provisioning profiles
      - name: Import certificates
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificate
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision > profile.plist
          python3 - <<'PYPROFILE'
          import os, plistlib
          with open('profile.plist', 'rb') as stream:
              profile = plistlib.load(stream)
          team = profile['TeamIdentifier'][0]
          bundle = profile['Entitlements']['application-identifier'].split('.', 1)[1]
          if bundle != 'ios.apps.wouri.tv':
              raise SystemExit('Provisioning profile does not match ios.apps.wouri.tv')
          with open('ios/ExportOptions.plist', 'rb') as stream:
              options = plistlib.load(stream)
          options.update(teamID=team, provisioningProfiles={bundle: profile['Name']})
          with open('ios/ExportOptions.generated.plist', 'wb') as stream:
              plistlib.dump(options, stream)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f"APPLE_TEAM_ID={team}\nIOS_PROFILE_NAME={profile['Name']}\n")
          PYPROFILE

      # Build iOS IPA
      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          
          # Archive with Xcode
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive
          
          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.generated.plist \
            -allowProvisioningUpdates
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ios/build/*.ipa
      
      # Deploy to TestFlight
      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # altool resolves keys from this directory using the key ID.
          mkdir -p private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          
          # Upload to TestFlight using altool or xcrun altool
          xcrun altool --upload-app \
            --type ios \
            --file ios/build/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      
      # Cleanup
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain
          rm -f certificate.p12 profile.plist ios/ExportOptions.generated.plist
          rm -rf private_keys
